# Слой bundle-плагина `dsh-i18n-layout-fix`.
#
# Установщик DSH читает `dsh.bundle.patch` из package.json и монтирует эту
# запись сам. Отключить плагин, не удаляя пакет, можно переопределением строки
# в cordis.patch.yml профиля:
